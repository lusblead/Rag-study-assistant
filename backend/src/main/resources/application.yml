spring:
  application:
    name: rag-study-assistant

  autoconfigure:
    exclude:
      - org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/rag_study_assistant?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}

  sql:
    init:
      mode: never
      schema-locations: classpath:db/schema.sql
      continue-on-error: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  upload:
    dir: ${APP_UPLOAD_DIR:./uploads}

milvus:
  host: ${MILVUS_HOST:localhost}
  port: ${MILVUS_PORT:19530}
  collection-name: ${MILVUS_COLLECTION:knowledge_chunk_vectors_bge_m3}
  embedding-dimension: ${EMBEDDING_DIMENSION:1024}

# 方案三第 07 章：新 collection，主键为应用计算的确定性 vectorId。
ingestion:
  artifact:
    # 解析与切块制品必须位于受控根目录；删除 Saga 只按 version 前缀清理。
    dir: ${INGESTION_ARTIFACT_DIR:${APP_UPLOAD_DIR:./uploads}/.ingestion-artifacts}
  scheduling:
    enabled: ${INGESTION_SCHEDULING_ENABLED:true}
  job:
    # Worker 会在阶段边界续租；单次不可中断调用仍必须小于该期限。
    lease-duration: ${INGESTION_JOB_LEASE_DURATION:PT5M}
  milvus:
    collection-name: ${INGESTION_MILVUS_COLLECTION:knowledge_chunk_vectors_ingestion_v2}
    # 生产保持 AUTOINDEX；公开效果评测通过独立参数使用 FLAT 精确索引。
    index-type: ${INGESTION_MILVUS_INDEX_TYPE:AUTOINDEX}

vector:
  provider: ${VECTOR_PROVIDER:milvus}

rag:
  top-k: ${RAG_TOP_K:5}
  candidate-k: ${RAG_CANDIDATE_K:20}
  similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.2}
  history-limit: ${RAG_HISTORY_LIMIT:8}

rerank:
  provider: ${RERANK_PROVIDER:local}
  base-url: ${RERANK_BASE_URL:https://api.siliconflow.cn/v1}
  api-key: ${RERANK_API_KEY:${SILICONFLOW_API_KEY:}}
  model: ${RERANK_MODEL:Pro/BAAI/bge-reranker-v2-m3}
  timeout-seconds: ${RERANK_TIMEOUT_SECONDS:60}
  fail-open: ${RERANK_FAIL_OPEN:true}
  max-chunks-per-doc: ${RERANK_MAX_CHUNKS_PER_DOC:1024}
  overlap-tokens: ${RERANK_OVERLAP_TOKENS:50}
  local:
    vector-weight: ${RERANK_LOCAL_VECTOR_WEIGHT:0.7}
    lexical-weight: ${RERANK_LOCAL_LEXICAL_WEIGHT:0.3}

agent:
  # false 使用配置的生产型 Provider；默认装配 Milvus 与 OpenAI-compatible Embedding/Chat 客户端。
  # true  = use pure in-memory mocks for quick backend-only debugging.
  mock: ${AGENT_MOCK:false}

llm:
  provider: ${LLM_PROVIDER:deepseek}
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
  model: ${LLM_MODEL:deepseek-v4-pro}
  system-prompt: ${LLM_SYSTEM_PROMPT:You are a knowledgeable study assistant. Provide detailed, thorough explanations. Break down complex concepts, use examples, and structure your answers clearly. Always ground your answers in the provided course material.}
  temperature: ${LLM_TEMPERATURE:0.6}
  timeout-seconds: ${LLM_TIMEOUT_SECONDS:120}
  thinking: ${LLM_THINKING:false}
  reasoning-effort: ${LLM_REASONING_EFFORT:}

embedding:
  provider: ${EMBEDDING_PROVIDER:openai-compatible}
  base-url: ${EMBEDDING_BASE_URL:https://api.siliconflow.com/v1}
  api-key: ${EMBEDDING_API_KEY:${SILICONFLOW_API_KEY:}}
  model: ${EMBEDDING_MODEL:BAAI/bge-m3}
  timeout-seconds: ${EMBEDDING_TIMEOUT_SECONDS:120}

ocr:
  thread-count: ${OCR_THREAD_COUNT:4}
  max-image-pixels: ${OCR_MAX_IMAGE_PIXELS:12000000}
  cache:
    enabled: ${OCR_CACHE_ENABLED:true}
    dir: ${OCR_CACHE_DIR:./uploads/.ocr-cache}
  tesseract:
    command: ${OCR_TESSERACT_COMMAND:tesseract}
    language: ${OCR_TESSERACT_LANGUAGE:chi_sim+eng}
    dpi: ${OCR_TESSERACT_DPI:220}
    timeout-seconds: ${OCR_TESSERACT_TIMEOUT_SECONDS:60}
