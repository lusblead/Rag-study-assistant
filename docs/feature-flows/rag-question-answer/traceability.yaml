version: 1
feature_id: "rag.question-answer"
title: "RAG 课程问答"
status: "implemented"

characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: true
  security_sensitive: true

nodes:
  E1:
    kind: entry
    description: 同步 RAG 问答入口
    trigger: POST /api/agent/chat
    code:
      - path: backend/src/main/java/com/rag/backend/agent/controller/RagChatController.java
        symbol: chat

  E2:
    kind: entry
    description: SSE 流式 RAG 问答入口
    trigger: POST /api/agent/chat/stream
    code:
      - path: backend/src/main/java/com/rag/backend/agent/controller/RagChatController.java
        symbol: stream

  D1:
    kind: decision
    description: 课程与问题字段通过入口校验
    condition: courseId 不为 null 且 question 包含非空白字符
    code:
      - path: backend/src/main/java/com/rag/backend/agent/controller/RagChatController.java
        symbol: validate
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/controller/RagChatControllerValidationTest.java
        symbol: missingCourseIdIsRejectedBeforeServiceCall
      - path: backend/src/test/java/com/rag/backend/agent/controller/RagChatControllerValidationTest.java
        symbol: blankQuestionIsRejectedBeforeServiceCall

  A1:
    kind: action
    description: 解析或创建会话并读取有限条最近消息
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: chat
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: stream
      - path: backend/src/main/java/com/rag/backend/agent/history/ChatHistoryService.java
        symbol: resolveSession
      - path: backend/src/main/java/com/rag/backend/agent/history/ChatHistoryService.java
        symbol: recentMessages

  D2:
    kind: decision
    description: 检索 query 是否需要拼接历史用户问题
    condition: recentMessages 中至少有一条 role=user 且内容非空
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: retrievalQuery
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceCharacterizationTest.java
        symbol: currentHappyPathRetrievesBeforeCallingModelAndThenWritesHistory
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceCharacterizationTest.java
        symbol: synchronousEmptyRetrievalRefusesLocallyWithoutCallingModel

  A2:
    kind: action
    description: 没有历史用户消息时仅使用当前问题检索
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: retrievalQuery
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceCharacterizationTest.java
        symbol: currentHappyPathRetrievesBeforeCallingModelAndThenWritesHistory

  A3:
    kind: action
    description: 把历史用户消息按现有顺序与当前问题拼成检索 query
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: retrievalQuery
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceCharacterizationTest.java
        symbol: synchronousEmptyRetrievalRefusesLocallyWithoutCallingModel

  A4:
    kind: action
    description: 服务端持久化或复用会话版本范围；非会话入口保留当前活动版本语义
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveInScope
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/RetrievalScope.java
        symbol: RetrievalScope
      - path: backend/src/main/java/com/rag/backend/agent/materials/SessionMaterialService.java
        symbol: acquire
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverActiveVersionTest.java
        symbol: emptyActiveVersionSetReturnsEmptyWithoutEmbeddingOrFallback

  D8:
    kind: decision
    description: 本次服务端确认的 scope 是否包含至少一个可读版本
    condition: scope.activeVersionIds is not empty
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverActiveVersionTest.java
        symbol: emptyActiveVersionSetReturnsEmptyWithoutEmbeddingOrFallback

  A12:
    kind: action
    description: 空范围返回合法空检索结果；沿用 NO_ACTIVE_VERSION 兼容诊断值
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverActiveVersionTest.java
        symbol: emptyActiveVersionSetReturnsEmptyWithoutEmbeddingOrFallback

  A13:
    kind: action
    description: DenseCandidateSource 在同一 scope 内执行向量召回、source threshold、MySQL 回表和版本复核
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/DenseCandidateSource.java
        symbol: retrieve
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/CandidateSource.java
        symbol: retrieve
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/CandidateBatch.java
        symbol: CandidateBatch
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/DenseCandidateSourceTest.java
        symbol: returnsRawScoresAndStableOrderWithinFrozenScope
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverActiveVersionTest.java
        symbol: mysqlRecheckDropsCandidateFromAStaleVersion
    external_call:
      system: Embedding provider and VersionedVectorSearch implementation
      timeout: Embedding request 120s by default; Milvus SDK explicit timeout is not configured
      failure_behavior: Propagate the retrieval failure; do not call the LLM or append this turn messages
      failure_nodes: [X2, X3]

  A14:
    kind: action
    description: 记录 requested/actual/attempt/fallback/semantic-empty 的 Rerank 执行结果并应用 FinalK
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveWithResult
      - path: backend/src/main/java/com/rag/backend/agent/rerank/KnowledgeReranker.java
        symbol: rerankWithResult
      - path: backend/src/main/java/com/rag/backend/agent/rerank/RerankExecutionResult.java
        symbol: RerankExecutionResult
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: remoteTechnicalFailureFallsBackToLocal

  D9:
    kind: decision
    description: 是否通过配置显式关闭 Hybrid 并回退 Dense-only
    condition: rag.hybrid.enabled 默认解析为 true；只有显式 false 才选择 Dense-only 回退
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/HybridDefaultConfigurationTest.java
        symbol: defaultsHybridOnWithoutManualEnableAndRetainsExplicitRollback
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: disabledGateKeepsDenseOnlyBehaviorAndNeverCallsLexical

  A15:
    kind: action
    description: 双源 Collector 使用同一个不可变 scope 收集 Dense 与 Lexical batch 及安全诊断
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/DualCandidateSourceCollector.java
        symbol: collect
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveHybrid
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: enabledGateUsesConfiguredWeightsOneScopeRerankAndFinalTopK

  D10:
    kind: decision
    description: 至少一个 CandidateSource 是否成功返回 batch
    condition: CandidateCollectionResult contains at least one successful batch
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/DualCandidateSourceCollector.java
        symbol: collect
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/DualCandidateSourceCollectorTest.java
        symbol: bothSourceFailuresFailClosed
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: bothSourceFailuresPropagateCandidateCollectionException
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: oneSourceFailureFailsOpenWithSuccessfulSourceRawOrderAndScores

  D11:
    kind: decision
    description: Dense 与 Lexical 是否都成功返回非空且正权重候选
    condition: both source batches are non-empty after applying zero-weight source semantics
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/fusion/RrfFusion.java
        symbol: fuse
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: oneEmptySourceFallsBackToTheNonEmptySource
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: twoEmptySourcesReturnEmpty
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: zeroWeightSourceDoesNotAddCandidatesOrForceRrf

  A16:
    kind: action
    description: 每路内部稳定去重后按 w/(k+rank) 分别贡献并跨路求和
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/fusion/RrfFusion.java
        symbol: fuse
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: overlappingChunkSumsBothSourceContributionsExactly
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: duplicateInsideOneSourceUsesOnlyItsFirstOneBasedRank
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: equalScoresUseChunkIdAscendingAsTieBreaker

  A17:
    kind: action
    description: 单路成功或单路非空时稳定去重并保留该路 raw score；双空返回空
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/fusion/RrfFusion.java
        symbol: fuse
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/fusion/RrfFusionTest.java
        symbol: singleSuccessfulSourceFallsBackWithRawScoreOrderAndStableDeduplication
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: oneSourceFailureFailsOpenWithSuccessfulSourceRawOrderAndScores

  A18:
    kind: action
    description: 按独立 Dense/Lexical SourceK 收集，并在融合或单源回退后冻结全局 CandidateK
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveHybrid
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/DualCandidateSourceCollector.java
        symbol: collect
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: globalCandidateKCapsFusedUnionBeforeRerank
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/eval/ReviewedDev45RerankAblationTest.java
        symbol: onlyTheExplicitReviewedDev45FileIsAccepted
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/DualCandidateSourceCollectorTest.java
        symbol: passesIndependentLimitsToDenseAndLexicalSources

  D12:
    kind: decision
    description: 把持久化 requested provider 映射为 none、local 或 remote 执行模式
    condition: RerankSettings.provider
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: requestedMode
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: noneKeepsOriginalCandidateOrder

  A19:
    kind: action
    description: requested none 时保持冻结候选精确原序且不应用 Rerank threshold
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: noneKeepsOriginalCandidateOrder

  A20:
    kind: action
    description: 对完整冻结候选执行一次 LocalLexicalKnowledgeReranker
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
      - path: backend/src/main/java/com/rag/backend/agent/rerank/LocalLexicalKnowledgeReranker.java
        symbol: rerank
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: remoteTechnicalFailureFallsBackToLocal

  A21:
    kind: action
    description: 对完整冻结候选发送一次有界 Remote Rerank 请求
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/RerankSettingsService.java
        symbol: rerankRemote
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/RerankSettingsServiceTimeoutTest.java
        symbol: localServerTimeoutIsClassifiedOnceWithoutExternalApi
    external_call:
      system: OpenAI-compatible SiliconFlow rerank endpoint
      timeout: rerank.timeout-seconds; one request and no automatic retry
      failure_behavior: Typed technical failure enters fail-open local fallback or fail-closed X2 without logging request or response bodies
      failure_nodes: [D13, D16, C1]

  D13:
    kind: decision
    description: Remote Rerank 是否返回完整、唯一、有限分数的冻结候选排列
    condition: remote call completes and response passes validation
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/RerankSettingsService.java
        symbol: parseRemoteResponse
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/RerankSettingsServiceTest.java
        symbol: nonEmptyInputRejectsInvalidRemoteResults

  D14:
    kind: decision
    description: Local Rerank 是否返回完整且没有候选集外 Chunk 的排列
    condition: local reranker returns a complete candidate permutation
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: validateCompletePermutation
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: requestedLocalTechnicalFailureFallsBackToOriginal

  D16:
    kind: decision
    description: Remote 技术失败后是否允许 fail-open
    condition: RerankSettings.failOpen is true
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: failClosedCarriesSanitizedExecutionResult

  D17:
    kind: decision
    description: Local 技术失败后是否允许 fail-open 到原序
    condition: RerankSettings.failOpen is true
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: requestedLocalFailureIsPropagatedWithExecutionWhenFailClosed

  A22:
    kind: action
    description: Remote 成功后把 actual reranker 记录为 remote
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult

  A23:
    kind: action
    description: Local 成功后把 actual reranker 记录为 local
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult

  C1:
    kind: compensation
    description: Remote 技术失败后使用同一冻结候选降级到 Local
    restores_or_resolves: Remote 不可用时仍可在不重新召回的前提下产生可排序候选
    failure_behavior: Local 再失败时仅允许进入 C2 或按 fail-closed 传播
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: remoteTechnicalFailureFallsBackToLocal

  C2:
    kind: compensation
    description: Local 技术失败后恢复 Rerank 输入的精确原始顺序
    restores_or_resolves: 两级 Reranker 均不可用时不丢失已经召回的候选
    failure_behavior: 不重新检索、不再调用 Remote 或 Local，直接进入 FinalK
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: rerankWithResult
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: remoteAndLocalTechnicalFailuresFallBackToOriginal

  D15:
    kind: decision
    description: 按 actual remote/local 选择独立 threshold；original/none bypass
    condition: actual mode threshold enabled and rerankScore >= configured minimum
    code:
      - path: backend/src/main/java/com/rag/backend/rerank/DynamicKnowledgeReranker.java
        symbol: postProcess
    tests:
      - path: backend/src/test/java/com/rag/backend/rerank/DynamicKnowledgeRerankerTest.java
        symbol: actualModeThresholdCanProduceSemanticEmptyWithoutFallback

  A38:
    kind: action
    description: 根据多样性开关决定 Rerank 只输出 FinalK 或输出阈值过滤后的完整 CandidateK 池
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: applyRerank
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverMmrTest.java
        symbol: disabledMmrPreservesCurrentFinalKAndRerankLimit
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverMmrTest.java
        symbol: enabledMmrReceivesOnlyTheFrozenCandidateKPool

  D25:
    kind: decision
    description: 是否启用默认关闭的 MMR 实验候选
    condition: rag.diversity.mmr.enabled=true
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelector.java
        symbol: enabled
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelectorTest.java
        symbol: disabledSelectorPreservesInputOrderAndLimitsFinalK
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelectorTest.java
        symbol: enabledSelectorUsesJaccardToAvoidNearDuplicateFinalK

  A39:
    kind: action
    description: 使用上游稳定 rank 相关性与 Jaccard 冗余从冻结候选池确定性选择 FinalK
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelector.java
        symbol: select
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/diversity/JaccardTextSimilarity.java
        symbol: similarity
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelectorTest.java
        symbol: enabledSelectorUsesJaccardToAvoidNearDuplicateFinalK
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/diversity/MmrDiversitySelectorTest.java
        symbol: tiesRemainDeterministicByUpstreamRankAndChunkId

  A24:
    kind: action
    description: 以 RetrievalExecutionResult 返回 FinalK chunks、source 诊断、Rerank requested/actual/fallback 与语义空原因
    code:
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/KnowledgeRetriever.java
        symbol: retrieveWithResult
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetriever.java
        symbol: retrieveWithResult
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/RetrievalExecutionResult.java
        symbol: RetrievalExecutionResult
      - path: backend/src/main/java/com/rag/backend/agent/retrieval/RetrievalDiagnostics.java
        symbol: RetrievalDiagnostics
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverActiveVersionTest.java
        symbol: emptyActiveVersionSetReturnsEmptyWithoutEmbeddingOrFallback
      - path: backend/src/test/java/com/rag/backend/agent/retrieval/MilvusKnowledgeRetrieverHybridTest.java
        symbol: successfulEmptySourcesExposeSemanticEmptyWithoutTechnicalFailure
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceEvidenceDecisionTest.java
        symbol: responseExposesRequestedActualAndFallbackWithoutDuplicatingChunks

  A25:
    kind: action
    description: 构造 EvidenceDecisionInput 并按合法空、歧义、可追踪性、来源匹配阈值、冲突和直接覆盖执行三分类 Policy
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: prepare
      - path: backend/src/main/java/com/rag/backend/agent/evidence/EvidenceDecisionInput.java
        symbol: EvidenceDecisionInput
      - path: backend/src/main/java/com/rag/backend/agent/evidence/EvidenceDecisionPolicy.java
        symbol: decide
      - path: backend/src/main/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicy.java
        symbol: decide
      - path: backend/src/main/java/com/rag/backend/agent/evidence/EvidenceDecisionProperties.java
        symbol: EvidenceDecisionProperties
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicyTest.java
        symbol: emptySuccessfulRetrievalRefuses
      - path: backend/src/test/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicyTest.java
        symbol: nonEmptyDistractorRefusesEvenWhenFinalScoreIsOne
      - path: backend/src/test/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicyTest.java
        symbol: vagueQuestionWithoutResolvableHistoryClarifies
      - path: backend/src/test/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicyTest.java
        symbol: conflictAcrossSourcesClarifiesButSameSourceRefuses
      - path: backend/src/test/java/com/rag/backend/agent/evidence/RuleBasedEvidenceDecisionPolicyTest.java
        symbol: directSingleEvidenceAnswersAndKeepsTraceableId

  A30:
    kind: action
    description: 按 usableEvidenceIds 选择 references，构造 RagChatMetadata 并写入不含 query 或 Chunk 正文的决策日志
    code:
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: usableChunks
      - path: backend/src/main/java/com/rag/backend/agent/chat/RagChatService.java
        symbol: logDecision
      - path: backend/src/main/java/com/rag/backend/agent/model/RagChatMetadata.java
        symbol: RagChatMetadata
      - path: backend/src/main/java/com/rag/backend/agent/evidence/EvidenceObservedSignals.java
        symbol: EvidenceObservedSignals
    tests:
      - path: backend/src/test/java/com/rag/backend/agent/chat/RagChatServiceEvidenceDecisionTest.java
