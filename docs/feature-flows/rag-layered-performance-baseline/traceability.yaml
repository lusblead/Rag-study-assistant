version: 1
feature_id: "rag.layered-performance-baseline"
title: "Layered RAG performance baseline"
status: "implemented"

characteristics:
  cross_component: true
  asynchronous: true
  persisted_state: true
  external_dependencies: true
  retry_or_compensation: false
  security_sensitive: true

nodes:
  E1:
    kind: entry
    description: "Invoke the repository-local PowerShell wrapper and Python entry point"
    trigger: "run-performance.ps1 with optional -Execute, or run_performance.py with optional --execute"
    code:
      - path: backend/evals/performance/run-performance.ps1
        symbol: run_performance.py
        role: repository-local wrapper
      - path: backend/evals/performance/run_performance.py
        symbol: main
        role: CLI entry
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_powershell_wrapper_only_dispatches_python_and_defaults_to_validation

  D1:
    kind: decision
    description: "Whether the caller explicitly requests execution"
    condition: "The parsed arguments contain --execute; every other invocation is validate-only"
    code:
      - path: backend/evals/performance/run_performance.py
        symbol: main
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_only_does_not_call_http_or_create_output
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execute_function_cannot_bypass_explicit_flag

  A1:
    kind: action
    description: "Validate profile, JMX and report-schema metadata without HTTP, JMeter execution or output creation"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_only
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_only_does_not_call_http_or_create_output

  D2:
    kind: decision
    description: "Whether all validate-only contracts pass"
    condition: "Profile validation, JMX 5.6.3 structure and exact health assertions, and report schema metadata are valid"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_only
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_profile
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_jmx
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_example_profile_is_safe_and_valid
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_jmx_rejects_weakened_health_or_answer_assertions

  D3:
    kind: decision
    description: "Whether L4 remains disabled"
    condition: "profile.layers.L4 is exactly false; profile validation and execution validation both reject any other value"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: profile_errors
      - path: backend/evals/performance/performance_workflow.py
        symbol: execution_gate_errors
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l4_is_always_rejected

  D4:
    kind: decision
    description: "Whether execution authorization, location, disposable-state and cost gates pass"
    condition: "CLI --execute and profile execution.enabled are true, disposableStateConfirmed is true, Backend and separate Actuator origins are loopback, external mode is disabled with budget zero, and a local zero-external-call metric path is configured; provider-budgeted is rejected"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_execution_gate
      - path: backend/evals/performance/performance_workflow.py
        symbol: execution_gate_errors
      - path: backend/evals/performance/performance_workflow.py
        symbol: external_policy_errors
      - path: backend/evals/performance/performance_workflow.py
        symbol: is_loopback_base_url
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_requires_cli_and_profile_double_gate
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_requires_loopback_and_disposable_state
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_actuator_origin_is_separate_and_must_be_loopback
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_external_budget_pair_is_fail_closed
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_zero_budget_execution_requires_measurable_zero_external_calls

  D5:
    kind: decision
    description: "Whether runtime-only payloads and identifiers satisfy enabled-layer contracts and the authorized workload fingerprint"
    condition: "A frozen entry-time environment copy contains a valid L1 token/body, a sufficiently large unique positive disposable L2 document-ID pool, and a valid L3 course/question with sessionId absent or null; their canonical fingerprint exactly matches workload.fixtureFingerprintSha256"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: runtime_environment_errors
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_runtime_environment
      - path: backend/evals/performance/performance_workflow.py
        symbol: runtime_fixture_fingerprint
      - path: backend/evals/performance/performance_workflow.py
        symbol: verify_runtime_fixture_fingerprint
      - path: backend/evals/performance/performance_workflow.py
        symbol: parse_document_id_pool
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_runtime_values_are_environment_only_and_shape_checked
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l2_rejects_duplicate_or_undersized_document_pool
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l3_requires_a_fresh_session_per_request
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_runtime_fixture_fingerprint_binds_payloads_and_scale_without_persisting_them
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_freezes_environment_before_runtime_callbacks

  D6:
    kind: decision
    description: "Whether JMX, exact JMeter version, launcher fingerprint and Git provenance are available"
    condition: "JMX validates, Apache JMeter resolves and reports exactly 5.6.3, its launcher file can be SHA-256 fingerprinted, and Git HEAD plus dirty fingerprint can be captured before output creation"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_jmx
      - path: backend/evals/performance/performance_workflow.py
        symbol: discover_jmeter
      - path: backend/evals/performance/performance_workflow.py
        symbol: jmeter_version
      - path: backend/evals/performance/performance_workflow.py
        symbol: git_snapshot
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_jmx_rejects_weakened_health_or_answer_assertions

  D7:
    kind: decision
    description: "Whether a new run directory can be created without overwriting anything"
    condition: "create_run_directory can mkdir the generated run ID with exist_ok=false"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: create_run_directory
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_run_directory_and_report_are_exclusive_create

  T1:
    kind: transition
    description: "Create the exclusive run directory without writing an initial manifest or status"
    entity: LayeredPerformanceRunArtifact
    from: ABSENT
    to: RUN_DIRECTORY_EXISTS
    trigger: "all pre-run gates pass and exclusive mkdir succeeds"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: create_run_directory
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_run_directory_and_report_are_exclusive_create

  D8:
    kind: decision
    description: "Whether the authorized runtime identity and required Actuator runtime evidence are available"
    condition: "Separate loopback Actuator reports the exact authorized runtime build SHA-256, health is UP, and CPU plus heap-used/max metrics are readable and valid"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: actuator_runtime_build_fingerprint
      - path: backend/evals/performance/performance_workflow.py
        symbol: actuator_preflight
      - path: backend/evals/performance/performance_workflow.py
        symbol: actuator_resource_sample
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_runtime_build_identity_is_read_live_from_actuator_info
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_missing_actuator_is_a_runtime_evidence_failure
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_scrapes_separate_actuator_loopback_origin

  D9:
    kind: decision
    description: "Whether the initial resource sample already triggers a stop"
    condition: "Heap ratio is strictly greater than its threshold, or another implemented resource stop condition returns a stop"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: evaluate_resource_stop
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_cpu_and_memory_thresholds_are_strict_greater_than
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_scrapes_separate_actuator_loopback_origin

  A2:
    kind: action
    description: "Build the enabled-layer warm-up and stable invocation order and partition the L2 document pool into disjoint invocation-scoped pools"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
      - path: backend/evals/performance/performance_workflow.py
        symbol: partition_unique_document_ids
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_document_pool_partition_is_disjoint_and_complete
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_example_profile_is_safe_and_valid

  A9:
    kind: action
    description: "Select the next ordered warm-up or stable invocation for an enabled L1-L3 layer"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_example_profile_is_safe_and_valid

  A3:
    kind: action
    description: "Verify snapshot and JMeter-launcher hashes, read the zero-external-call counter, run one JMeter invocation while sampling CPU and heap, then verify hashes and counter again"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: external_call_counter
      - path: backend/evals/performance/performance_workflow.py
        symbol: run_jmeter_invocation
      - path: backend/evals/performance/performance_workflow.py
        symbol: jmeter_arguments
      - path: backend/evals/performance/performance_workflow.py
        symbol: runtime_artifacts_are_stable
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_zero_budget_execution_requires_measurable_zero_external_calls
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmeter_command_has_no_token_payload_or_business_id
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_marks_snapshot_drift_invalid_after_invocation

  D10:
    kind: decision
    description: "Which pre-run-authorized JMX layer handles the current invocation"
    condition: "After profile and execution gates have rejected L4, PERF_LAYER is L1, L2 or L3; no executable L4 branch exists"
    code:
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L1 branch
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L2 branch
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L3 branch
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l4_is_always_rejected

  A4:
    kind: action
    description: "Execute L1 through the protected retrieval probe and require HTTP 200 with degraded exactly false and status exactly success"
    code:
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L1-retrieval
      - path: backend/src/main/java/com/rag/backend/observability/performance/RetrievalPerformanceProbeController.java
        symbol: retrieve
      - path: backend/src/main/java/com/rag/backend/observability/performance/RetrievalPerformanceProbeResponse.java
        symbol: from
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_jmx_rejects_weakened_health_or_answer_assertions
      - path: backend/src/test/java/com/rag/backend/observability/performance/RetrievalPerformanceProbeControllerTest.java
        symbol: authorizedProbeReturnsOnlySanitizedAggregates
    external_call:
      system: "loopback Backend retrieval path"
      timeout: "5 second connect and 30 second response timeout"
      failure_behavior: "JMeter records a failed sample; no automatic request retry"
      failure_nodes: [D11]

  A5:
    kind: action
    description: "Execute L2 by atomically consuming one unique disposable document ID, requiring a non-reused 202 submission, and polling the job to terminal or deadline"
    code:
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L2-acquire-unique-document
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L2-ingest-submit
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L2-ingest-poll
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L2-terminal-check
      - path: backend/src/main/java/com/rag/backend/document/DocumentController.java
        symbol: ingest
      - path: backend/src/main/java/com/rag/backend/ingestionlab/job/IngestJobController.java
        symbol: getJob
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l2_rejects_duplicate_or_undersized_document_pool
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_document_pool_partition_is_disjoint_and_complete
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_token_and_payloads_are_environment_only
    external_call:
      system: "loopback Backend asynchronous ingestion and its already-running local dependencies"
      timeout: "30 second HTTP response timeout and profile-bounded terminal poll deadline"
      failure_behavior: "FAILED, CANCELLED or deadline becomes a failed sample; reused jobs, pool exhaustion or insufficient duration fail runtime evidence; submission is never retried"
      failure_nodes: [D11, D13]

  A6:
    kind: action
    description: "Execute L3 with no fixed session ID and require HTTP 200 with evidence decision exactly ANSWER"
    code:
      - path: backend/evals/performance/rag-layered-performance.jmx
        symbol: L3-chat
      - path: backend/src/main/java/com/rag/backend/agent/controller/RagChatController.java
        symbol: chat
      - path: backend/evals/performance/performance_workflow.py
        symbol: runtime_environment_errors
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l3_requires_a_fresh_session_per_request
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_jmx_xml_and_key_samplers
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_validate_jmx_rejects_weakened_health_or_answer_assertions
    external_call:
      system: "loopback Backend chat path configured to keep the external-call counter unchanged"
      timeout: "5 second connect and 120 second response timeout"
      failure_behavior: "JMeter records a failed sample; provider-budgeted execution is rejected and no automatic request retry occurs"
      failure_nodes: [D11]

  A7:
    kind: action
    description: "Record Backend span END duration through monotonic time and low-cardinality operation/result metrics; these metrics are not scraped into report samplerMetrics"
    code:
      - path: backend/src/main/java/com/rag/backend/observability/trace/TraceContextService.java
        symbol: open
      - path: backend/src/main/java/com/rag/backend/observability/trace/TraceContextService.java
        symbol: close
      - path: backend/src/main/java/com/rag/backend/observability/trace/TraceContextService.java
        symbol: emit
      - path: backend/src/main/java/com/rag/backend/observability/performance/TracePerformanceMetrics.java
        symbol: recordSpanDuration
    tests:
      - path: backend/src/test/java/com/rag/backend/observability/TraceContextDurationTest.java
        symbol: onlyEndEventCarriesDeterministicMonotonicDuration
      - path: backend/src/test/java/com/rag/backend/observability/TraceContextDurationTest.java
        symbol: negativeClockDeltaIsClampedToZero
      - path: backend/src/test/java/com/rag/backend/observability/TraceContextDurationTest.java
        symbol: monotonicClockFailureFallsBackToZeroWithoutBreakingScope
      - path: backend/src/test/java/com/rag/backend/observability/performance/TracePerformanceMetricsTest.java
        symbol: endSpanRecordsOnlySafeOperationAndResultTags
      - path: backend/src/test/java/com/rag/backend/observability/performance/TracePerformanceMetricsTest.java
        symbol: registryFailureCannotChangeSpanResultOrCleanup

  D11:
    kind: decision
    description: "Whether invocation, artifact, resource and zero-external-call evidence is usable"
    condition: "The frozen snapshots and JMeter launcher remain hash-stable before and after invocation, JMeter and resource sampling complete or return an implemented resource stop, and the zero-external-call counter is readable and unchanged"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: run_jmeter_invocation
      - path: backend/evals/performance/performance_workflow.py
        symbol: external_call_counter
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_zero_budget_execution_requires_measurable_zero_external_calls
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_missing_actuator_is_a_runtime_evidence_failure
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_scrapes_separate_actuator_loopback_origin
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_marks_snapshot_drift_invalid_after_invocation

  D12:
    kind: decision
    description: "Whether the completed invocation is warm-up or stable-state measurement"
    condition: "execute_workflow is in the per-layer warm-up branch or the configured concurrency loop"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_example_profile_is_safe_and_valid

  D13:
    kind: decision
    description: "Whether warm-up produced sufficient, non-reused primary evidence"
    condition: "A primary sample exists; for L2 no 597 reuse or 598 exhaustion occurred; invocation and primary span cover at least 90 percent; every thread joins near the start, remains evidenced through the tail, and has no unsupported inactive gap"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: read_jtl
      - path: backend/evals/performance/performance_workflow.py
        symbol: sample_coverage_seconds
      - path: backend/evals/performance/performance_workflow.py
        symbol: require_window_evidence
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_csv_jtl_aggregation
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_l2_rejects_duplicate_or_undersized_document_pool
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_window_evidence_requires_real_duration_and_every_thread

  A8:
    kind: action
    description: "Aggregate privacy-safe stable JTL primary and sampler-label rows into nearest-rank latency, throughput, error, 429 and 5xx metrics"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: aggregate_jtl
      - path: backend/evals/performance/performance_workflow.py
        symbol: aggregate_samples
      - path: backend/evals/performance/performance_workflow.py
        symbol: nearest_rank
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_nearest_rank_percentiles
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_error_throughput_and_status_aggregation
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_csv_jtl_aggregation

  D14:
    kind: decision
    description: "Whether a stable window triggers an HTTP or latency stop"
    condition: "Any sampler has HTTP 429, primary error rate exceeds the configured threshold, or P99 exceeds the lowest-concurrency multiplier for the required consecutive analysis windows"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: evaluate_window_stop
      - path: backend/evals/performance/performance_workflow.py
        symbol: consecutive_window_p99_breach
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_any_429_stops_even_when_primary_sampler_is_clean
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_p99_requires_consecutive_windows
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_error_throughput_and_status_aggregation

  D15:
    kind: decision
    description: "Whether another configured warm-up or stable invocation remains"
    condition: "The enabled-layer loop and concurrency list still contain an invocation"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_example_profile_is_safe_and_valid

  A10:
    kind: action
    description: "Prepare a FAILED RUNTIME report after a caught RuntimeEvidenceError"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: base_report
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_missing_actuator_is_a_runtime_evidence_failure
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_report_schema_versions_required_status_and_evidence_fields

  A11:
    kind: action
    description: "Prepare a STOPPED RUNTIME report with the exact resource or window stop reason"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
      - path: backend/evals/performance/performance_workflow.py
        symbol: evaluate_resource_stop
      - path: backend/evals/performance/performance_workflow.py
        symbol: evaluate_window_stop
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_scrapes_separate_actuator_loopback_origin
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_cpu_and_memory_thresholds_are_strict_greater_than
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_any_429_stops_even_when_primary_sampler_is_clean

  A12:
    kind: action
    description: "Prepare a COMPLETED RUNTIME report after every configured invocation finishes"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: execute_workflow
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_report_schema_versions_required_status_and_evidence_fields

  D16:
    kind: decision
    description: "Recheck final runtime identity and source/artifact/Git/JMeter stability, rewriting drift to a FAILED and INVALID terminal tuple before report validation and exclusive creation"
    condition: "A final identity failure sets stopReason RUNTIME_IDENTITY; any final source, snapshot, Git or JMeter-launcher drift sets SOURCE_DRIFT and takes precedence; after reconciliation, report cross-fields and performance-report.json open mode x must succeed"
    code:
      - path: backend/evals/performance/performance_workflow.py
        symbol: actuator_runtime_build_fingerprint
      - path: backend/evals/performance/performance_workflow.py
        symbol: write_report_exclusive
      - path: backend/evals/performance/performance_workflow.py
        symbol: validate_report_shape
    tests:
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_run_directory_and_report_are_exclusive_create
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_report_refuses_sensitive_field_and_contains_no_supplied_secret
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_report_rejects_impossible_runtime_status_combinations
      - path: backend/evals/performance/tests/test_performance_workflow.py
        symbol: test_execution_marks_snapshot_drift_invalid_after_invocation
      - path: backend/evals/performance/tests/test_performance_workflow.py
